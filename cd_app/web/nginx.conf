server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API proxy. The upstream is resolved lazily via Docker's embedded DNS
    # (127.0.0.11) through a variable, so nginx starts even when the api
    # container is absent or restarting (the landing page stays up; /api just
    # 502s until the api is running). The rewrite strips the /api prefix so the
    # backend sees /conversations etc. SSE needs buffering off + long timeout.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cd_api christian-doctrine-api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$cd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
