# christian-doctrine.ebenezer-isaac.com
#
# web (nginx) serves the Flutter bundle and proxies /api -> api.
# api (FastAPI) drives Claude via the Agent SDK over the doctrine engine MCP.
# mongodb keeps the conversation index and chat history (database christian_doctrine).
#
# Networks:
#   default         private to this project; api reaches mongodb here (no host port)
#   server-network  shared and external, so the Cloudflare tunnel can reach web
#                   (see ~/live/infra/cloudflare/README.md)

services:
  api:
    build: ./backend
    image: christian-doctrine-api:latest
    container_name: christian-doctrine-api
    restart: unless-stopped
    env_file: .env
    environment:
      - HOME=/home/app
    volumes:
      # SDK session transcripts persist here so conversations can resume.
      - claude-sessions:/home/app/.claude
      # Generated doctrine PDFs, read-only.
      - ./archive_pdfs:/archive:ro
    extra_hosts:
      # lets the container reach host-side services if ever needed
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - default

  web:
    build: ./web
    image: christian-doctrine-web:latest
    container_name: christian-doctrine-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - server-network

  mongodb:
    image: mongo:7
    container_name: christian-doctrine-mongodb
    restart: unless-stopped
    # Root login and the app user password; see mongo.env.example.
    env_file: mongo.env
    # Small data set: cap the WiredTiger cache instead of half the host RAM.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb-data:/data/db
      # Runs once on an empty volume: creates the cd_app user (readWrite on christian_doctrine).
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand(\"ping\").ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - default

volumes:
  claude-sessions:
  mongodb-data:

networks:
  default:
  server-network:
    external: true
