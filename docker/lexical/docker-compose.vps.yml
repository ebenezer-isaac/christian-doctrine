# VPS serving override: smaller memory (query serving, not building) + auto
# restart on reboot to match the other sites on this host.
name: brethren-lexical
services:
  lexical-neo4j:
    restart: unless-stopped
    environment:
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 3G
  lexical-qdrant:
    restart: unless-stopped
